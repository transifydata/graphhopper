graphhopper:
  # Full extract - ferries are no longer stripped from the PBF; the walk profile
  # excludes them via custom_models/walk_no_ferry.json instead.
  datareader.file: "../north-america-latest.osm.pbf"
  graph.location: graph-cache-north-america

  # GH 9+ profiles: no 'vehicle'/'weighting' keys; each profile IS its custom model.
  # Encoded values referenced by the custom models are added to the graph automatically.
  profiles:
    - name: car
      # motorcar/motor_vehicle turn restrictions from OSM apply to this profile
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
      custom_model_files: [car_transify.json]
    - name: transit_car
      # based on bus: busways allowed via bus_access, legal weight/width/height road
      # limits removed, and NO turn_costs block = no turn restrictions
      custom_model_files: [transit_car.json]
    - name: bike
      custom_model_files: [bike.json, bike_elevation.json]
    - name: walk
      custom_model_files: [foot.json, walk_no_ferry.json]

  custom_models.directory: custom_models

  profiles_ch:
    - profile: car
    - profile: transit_car
    - profile: bike
    - profile: walk
  profiles_lm: []

  # first eight are for path details / SPT columns; the rest are required by the
  # custom models above (GH 11 requires listing them once graph.encoded_values is set;
  # on a mismatch the server prints the exact line to paste here)
  graph.encoded_values: average_slope, max_slope, surface, toll, track_type, road_class, road_environment, max_speed, car_access, car_average_speed, road_access, bus_access, bike_priority, bike_road_access, mtb_rating, hike_rating, country, bike_access, bike_average_speed, foot_access, foot_priority, foot_road_access, foot_average_speed

  prepare.ch.threads: 8
  graph.elevation.provider: cgiar
  graph.elevation.cache_dir: ./elevation/
  prepare.min_network_size: 200
  routing.non_ch.max_waypoint_distance: 1000000
  import.osm.ignored_highways: []
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
  - type: http
    port: 8989
  request_log:
      appenders: []
  admin_connectors:
  - type: http
    port: 8990
    bind_host: localhost
logging:
  appenders:
  - type: file
    time_zone: UTC
    current_log_filename: logs/graphhopper.log
    log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    archive: true
    archived_log_filename_pattern: ./logs/graphhopper-%d.log.gz
    archived_file_count: 30
    never_block: true
  - type: console
    time_zone: UTC
    log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
